name: PR Automation

on:
  pull_request:
    types: [opened, reopened]

permissions:
  issues: write
  pull-requests: write

jobs:
  assign-author:
    runs-on: ubuntu-latest
    steps:
      - name: Assign PR author as assignee
        uses: actions/github-script@v9
        with:
          script: |
            const author = context.payload.pull_request.user;
            // Bots (e.g. dependabot[bot]) can't be assigned to issues/PRs -
            // GitHub rejects it with 403. Fall back to the repo owner so
            // those PRs still get someone to review them.
            const assignee = author.type === "Bot" ? context.repo.owner : author.login;

            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              assignees: [assignee],
            });

  label-by-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Label based on branch name prefix
        uses: actions/github-script@v9
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;

            // Add prefixes here as the project's branch naming grows.
            // Order matters: the first matching rule wins.
            const rules = [
              { pattern: /^(feat|feature)\//, label: "enhancement" },
              { pattern: /^(fix|bugfix|hotfix)\//, label: "bug" },
              { pattern: /^docs?\//, label: "documentation" },
              { pattern: /^question\//, label: "question" },
            ];

            const matched = rules.find((rule) => rule.pattern.test(branch));
            if (!matched) {
              console.log(`No label rule matched for branch "${branch}"`);
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: [matched.label],
            });
