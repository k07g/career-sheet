name: Terraform Dev Apply

# main にマージされ、dev環境のTerraformコード(Amplifyアプリの設定)が
# 変更された場合に、Amplifyアプリ/ブランチのリソースを自動でterraform applyする。
# アプリ本体のビルド・デプロイはAmplifyの自動ビルド機能が行うため、このワーク
# フローの役目はAmplify側の設定(ビルド設定・環境変数など)を最新化することのみ。
on:
  push:
    branches: [main]
    paths:
      - terraform/environments/dev/**
      - .github/workflows/terraform-dev-apply.yml
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

# 同時実行によるstate競合を防ぐ
concurrency:
  group: terraform-dev-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # リポジトリの Settings > Environments > dev で必須レビュアーを設定
    # すれば、apply前に手動承認を挟むことも可能(既定では承認不要)。
    environment: dev
    defaults:
      run:
        working-directory: terraform/environments/dev
    env:
      TF_VAR_github_access_token: ${{ secrets.AMPLIFY_GITHUB_ACCESS_TOKEN }}
      TF_VAR_g4_api_base_url: ${{ vars.G4_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEV_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION || 'ap-northeast-1' }}"

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
