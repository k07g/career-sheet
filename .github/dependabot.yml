version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # eslint-config-next (via eslint-plugin-react) doesn't support ESLint 10
      # yet, so a major bump here breaks `next lint`. Remove once upstream
      # catches up.
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      # typescript-eslint (via eslint-config-next) only supports
      # typescript >=4.8.4 <6.1.0 and explicitly rejects TS 7.x at runtime.
      # Remove once upstream catches up.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
